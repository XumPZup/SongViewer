<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Song Viewer</title>
  <!--script defer src="scripts.js"></script-->
  <style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap');
#title {
  text-align: center;
  font-family: 'Georgia', serif;
  margin: 0;
}

#song {
  white-space: pre-wrap;
  line-height: 1.2em;
  margin: 2rem;
}

.chords {
  font-family: 'Lora', serif;
  font-size: 12px;
  font-weight: 600;
  color: #222;
  margin: 0;
}

.lyrics {
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: #333;
  margin: 0 0 0 0;
}
.buttons {
  margin: 10px 0;
}

button {
  margin-right: 5px;
  padding: 4px 8px;
}
  </style>
</head>
<body>
  <select id="song-select"><option>No song selected</option></select>

  <div class="buttons">
    <button id="transpose-up">Transpose ↑</button>
    <button id="transpose-down">Transpose ↓</button>
  </div>

  <div id="song"></div>

  <script  src="scripts.js"></script>
</body>
</html>
